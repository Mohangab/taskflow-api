<div class="auth-page">
  <div class="auth-card card shadow-lg border-0">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-icon mb-2"><i class="bi bi-kanban-fill"></i></div>
        <h1 class="h3 fw-bold mb-1">Welcome back</h1>
        <p class="text-muted mb-0">Sign in to TaskFlow</p>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger py-2" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ errorMessage }}
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label class="form-label" for="login-email">Email</label>
          <input
            id="login-email"
            type="email"
            class="form-control form-control-lg"
            formControlName="email"
            autocomplete="email"
            placeholder="you@example.com"
            [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid"
          />
          <div class="invalid-feedback">Enter a valid email.</div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="login-password">Password</label>
          <input
            id="login-password"
            type="password"
            class="form-control form-control-lg"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
            [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
          />
          <div class="invalid-feedback">Password is required.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
          {{ loading ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>

      <p class="text-center text-muted mt-4 mb-0">
        New here?
        <a routerLink="/register" class="fw-semibold">Create an account</a>
      </p>
    </div>
  </div>
</div>
