<div class="auth-page">
  <div class="auth-card card shadow-lg border-0">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-icon mb-2"><i class="bi bi-person-plus-fill"></i></div>
        <h1 class="h3 fw-bold mb-1">Create account</h1>
        <p class="text-muted mb-0">Start managing tasks with TaskFlow</p>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger py-2" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ errorMessage }}
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label class="form-label" for="reg-email">Email</label>
          <input
            id="reg-email"
            type="email"
            class="form-control form-control-lg"
            formControlName="email"
            autocomplete="email"
            placeholder="you@example.com"
            [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid"
          />
          <div class="invalid-feedback">Enter a valid email.</div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="reg-password">Password</label>
          <input
            id="reg-password"
            type="password"
            class="form-control form-control-lg"
            formControlName="password"
            autocomplete="new-password"
            placeholder="At least 6 characters"
            [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
          />
          <div class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
          {{ loading ? 'Creating…' : 'Create account' }}
        </button>
      </form>

      <p class="text-center text-muted mt-4 mb-0">
        Already have an account?
        <a routerLink="/login" class="fw-semibold">Sign in</a>
      </p>
    </div>
  </div>
</div>
