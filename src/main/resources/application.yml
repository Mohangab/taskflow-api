spring:
  application:
    name: taskflow-api
  datasource:
    url: jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

app:
  jwt:
    # Override in production via APP_JWT_SECRET env var (Base64 or plain, min 32 bytes)
    secret: ${APP_JWT_SECRET:TaskFlowDevSecretKeyMustBeAtLeast32BytesLong!}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.taskflow: INFO
    org.springframework.security: WARN
